<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MecaBruna</title>
<style>
/* ============================================================
   MecaBruna — Curs complet de mecanografia / Curso / Course
   Trilingüe: Català · Castellano · English
   ============================================================ */

:root{
  --bg:#eef2ff;
  --bg2:#fdf2f8;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --line:#e6e8f5;
  --ink:#1e1b4b;
  --ink-2:#5b5f85;
  --ink-3:#8b90b5;
  --primary:#6d5efc;
  --primary-d:#4f39d8;
  --ok:#16a34a;
  --ok-soft:#dcfce7;
  --bad:#e11d48;
  --bad-soft:#ffe4e6;
  --warn:#f59e0b;
  --gold:#fbbf24;
  --radius:20px;
  --shadow:0 1px 2px rgba(30,27,75,.05), 0 8px 24px -8px rgba(30,27,75,.15);
  --shadow-lg:0 20px 60px -20px rgba(30,27,75,.35);
  --f-L5:#ef4444; --f-L4:#f59e0b; --f-L3:#22c55e; --f-L2:#3b82f6;
  --f-R2:#8b5cf6; --f-R3:#ec4899; --f-R4:#14b8a6; --f-R5:#f97316;
  --f-TH:#94a3b8; --f-L1:#94a3b8; --f-R1:#94a3b8;
  --font:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --bg:#12132a; --bg2:#1b1436; --surface:#1c1e3d; --surface-2:#22254a;
  --line:#2e3163; --ink:#eef0ff; --ink-2:#b3b8e0; --ink-3:#7d83b5;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  --ok-soft:#0f3d24; --bad-soft:#4a1024;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);
  color:var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, var(--bg2), transparent 60%),
    radial-gradient(1000px 500px at 100% 0%, #e0f2fe66, transparent 55%),
    var(--bg);
  background-attachment:fixed;
  min-height:100%;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font-family:inherit}

/* ---------- Layout ---------- */
.app{max-width:1180px;margin:0 auto;padding:18px 20px 80px}

header.top{
  display:flex;align-items:center;gap:14px;
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);
  position:sticky;top:12px;z-index:50;backdrop-filter:blur(8px);
}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.02em}
.brand .logo{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:21px;
  background:linear-gradient(140deg,var(--primary),#b06dfc 60%,#ff7ac6);
  box-shadow:0 6px 16px -6px var(--primary);
}
.brand small{display:block;font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.brand .name{font-size:17px;line-height:1.05}

nav.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
nav.tabs button{
  padding:9px 13px;border-radius:12px;font-weight:650;font-size:13.5px;color:var(--ink-2);
  transition:.15s;display:flex;align-items:center;gap:7px
}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button.active{background:var(--primary);color:#fff;box-shadow:0 6px 14px -6px var(--primary)}

.langsel{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.langsel button{
  padding:5px 7px;border-radius:9px;transition:.15s;display:grid;place-items:center;opacity:.72;filter:saturate(.8)
}
.langsel button:hover{opacity:1;filter:none;transform:translateY(-1px)}
.langsel button.on{background:var(--primary);opacity:1;filter:none;box-shadow:0 4px 10px -5px var(--primary)}
.langsel svg{width:27px;height:18px;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.langsel.big{justify-content:center;margin-bottom:18px;background:transparent;border:0;padding:0;gap:10px}
.langsel.big button{padding:8px;border:2px solid var(--line);border-radius:14px}
.langsel.big button.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent)}
.langsel.big svg{width:44px;height:29px;border-radius:5px}
.langsel.big .lname{font-size:10.5px;font-weight:800;color:var(--ink-2);margin-top:5px;letter-spacing:.02em}

.userchip{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);transition:.15s;text-align:left}
.userchip:hover{border-color:var(--primary);box-shadow:var(--shadow)}
.av{border-radius:99px;display:grid;place-items:center;overflow:hidden;background:linear-gradient(140deg,#ffd6a5,#ffb3e6);flex:none}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.userchip .av{width:50px;height:50px;font-size:27px;box-shadow:0 0 0 2px var(--surface),0 0 0 4px color-mix(in srgb,var(--primary) 30%,transparent)}

/* ---------- Perfils ---------- */
.profgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.profcard{
  background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:20px 16px;
  text-align:center;box-shadow:var(--shadow);transition:.15s;position:relative
}
.profcard:hover{transform:translateY(-3px);border-color:var(--primary);box-shadow:var(--shadow-lg)}
.profcard.active{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 7%,var(--surface))}
.profcard .av{width:116px;height:116px;font-size:62px;margin:0 auto 14px;box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--line)}
.profcard.active .av{box-shadow:0 0 0 3px var(--surface),0 0 0 6px color-mix(in srgb,var(--primary) 45%,transparent)}
.profcard .pn{font-size:17px;font-weight:800;letter-spacing:-.01em}
.profcard .pa{font-size:12px;color:var(--ink-3);font-weight:700;margin-top:2px}
.profcard .pstats{display:flex;justify-content:center;gap:12px;margin-top:11px;font-size:11.5px;font-weight:750;color:var(--ink-2)}
.profcard .pstats b{display:block;font-size:16px;color:var(--ink);letter-spacing:-.02em}
.profcard .edit{position:absolute;top:9px;right:9px;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:14px;background:var(--surface-2);border:1px solid var(--line);opacity:0;transition:.15s}
.profcard:hover .edit{opacity:1}
.profcard .edit:hover{background:var(--primary);color:#fff}
.profcard.add{border-style:dashed;display:grid;place-items:center;min-height:190px;color:var(--ink-3);font-weight:800;font-size:14px;gap:8px}
.profcard.add:hover{color:var(--primary)}
.profcard.add .plus{font-size:38px;line-height:1}

.field{margin-bottom:16px}
.field label{display:block;font-size:12.5px;font-weight:800;color:var(--ink-2);margin-bottom:6px}
.field input{
  width:100%;padding:12px 15px;border-radius:13px;border:2px solid var(--line);
  background:var(--surface-2);color:var(--ink);font-size:15.5px;font-weight:650;outline:none
}
.field input:focus{border-color:var(--primary);background:var(--surface)}
.avpreview{width:132px;height:132px;font-size:72px;margin:0 auto 16px;border:4px solid var(--line)}
.avgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avgrid button{aspect-ratio:1;border-radius:12px;font-size:22px;background:var(--surface-2);border:2px solid transparent;display:grid;place-items:center;transition:.12s}
.avgrid button:hover{transform:scale(1.1)}
.avgrid button.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 14%,var(--surface))}
.photorow{display:flex;gap:8px;margin-top:12px}
.photorow .btn{flex:1;padding:11px 10px;font-size:13.5px}
.camwrap{position:relative;border-radius:18px;overflow:hidden;background:#0b0b1a;aspect-ratio:1;max-width:320px;margin:0 auto}
.camwrap video,.camwrap img{width:100%;height:100%;object-fit:cover;display:block;transform:scaleX(-1)}
.camnote{font-size:13px;color:var(--ink-2);line-height:1.55;background:var(--surface-2);border-radius:14px;padding:14px 16px;text-align:left}
.userchip .lv{font-size:11px;color:var(--ink-3);font-weight:700;letter-spacing:.04em}
.userchip .nm{font-size:13.5px;font-weight:750;line-height:1.1}
.xpbar{width:88px;height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#ff7ac6);border-radius:99px;transition:width .5s}

/* ---------- Cards / genèric ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.pad{padding:22px}
h2.sec{font-size:22px;letter-spacing:-.02em;margin:26px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec .sub{font-size:13px;font-weight:600;color:var(--ink-3);margin-left:auto}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:14px;font-weight:750;font-size:14.5px;
  background:var(--surface-2);color:var(--ink);border:1px solid var(--line);transition:.15s
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn.primary{background:linear-gradient(135deg,var(--primary),#8b5cf6);color:#fff;border-color:transparent;box-shadow:0 10px 22px -12px var(--primary)}
.btn.ghost{background:transparent}
.btn.big{padding:15px 28px;font-size:16px;border-radius:16px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

.hidden{display:none !important}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) 252px;gap:18px;margin-top:18px;align-items:start}
.maincol{display:flex;flex-direction:column;gap:16px;min-width:0}
.rail{display:flex;flex-direction:column;gap:16px}
.rail .card{padding:18px}
.hero .panel{
  border-radius:26px;padding:26px 28px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(135deg,#6d5efc,#9333ea 45%,#ec4899);
  box-shadow:var(--shadow-lg);
}
.hero .panel:after{
  content:"";position:absolute;inset:auto -60px -90px auto;width:280px;height:280px;border-radius:50%;
  background:rgba(255,255,255,.13)
}
.hero h1{font-size:31px;letter-spacing:-.03em;line-height:1.12;margin-bottom:8px;position:relative;z-index:2}
.hero p{opacity:.92;font-size:14.5px;max-width:48ch;line-height:1.55;position:relative;z-index:2}
.hero .row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;position:relative;z-index:2}
.hero .btn{background:rgba(255,255,255,.16);color:#fff;border-color:rgba(255,255,255,.25);backdrop-filter:blur(4px)}
.hero .btn.solid{background:#fff;color:var(--primary-d);border-color:transparent}

.goal{display:flex;flex-direction:column;gap:8px}
.railtitle{font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:7px}
.gauge{display:grid;place-items:center;padding:10px 0 2px}
.gauge svg{width:150px;height:90px;overflow:visible}
.gauge .val{font-size:32px;font-weight:850;letter-spacing:-.03em;line-height:1;margin-top:-28px}
.gauge .lbl{font-size:10px;color:var(--ink-3);font-weight:800;letter-spacing:.07em;text-transform:uppercase;margin-top:5px;text-align:center;line-height:1.4}
.goalmsg{text-align:center;font-size:12px;color:var(--ink-3);font-weight:700;line-height:1.5;margin-top:2px}

.dose{display:flex;flex-direction:column;gap:6px}
.dose .big{font-size:30px;font-weight:850;letter-spacing:-.03em;line-height:1;
  background:linear-gradient(120deg,var(--primary),#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
.dose .txt{font-size:12px;color:var(--ink-2);font-weight:650;line-height:1.5}

.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat .sico{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:14px}
.stat b{display:block;font-size:25px;letter-spacing:-.03em;line-height:1.1}
.stat span{font-size:11.5px;color:var(--ink-3);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.stat .lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stat .lblrow em{font-style:normal;font-size:12px;font-weight:850;color:var(--primary);letter-spacing:0}
.stat .minibar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:9px}
.stat .minibar i{display:block;height:100%;width:0;border-radius:99px;transition:width .7s cubic-bezier(.2,1,.3,1);
  background:linear-gradient(90deg,var(--primary),#ec4899)}
.stat .substat{font-size:11.5px;font-weight:750;color:var(--ink-2);margin-top:9px;letter-spacing:0;text-transform:none}

/* ---------- Mapa del curs ---------- */
.unit{margin-bottom:14px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.unit-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;transition:.15s}
.unit-head:hover{background:var(--surface-2)}
.unit-ico{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;color:#fff;flex:none}
.unit-title{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.unit-desc{font-size:12.8px;color:var(--ink-3);margin-top:2px}
.unit-prog{margin-left:auto;display:flex;align-items:center;gap:12px;flex:none}
.ring{width:44px;height:44px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:5;stroke-linecap:round}
.unit-prog .pct{font-size:12px;font-weight:800;color:var(--ink-2);min-width:36px;text-align:right}
.chev{color:var(--ink-3);transition:.25s;font-size:13px}
.unit.open .chev{transform:rotate(90deg)}
.lessons{display:none;padding:4px 14px 16px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px}
.unit.open .lessons{display:grid}

.lesson{
  text-align:left;border:1px solid var(--line);border-radius:16px;padding:13px 14px;background:var(--surface-2);
  display:flex;flex-direction:column;gap:6px;transition:.15s;position:relative;overflow:hidden
}
.lesson:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--primary)}
.lesson.locked{opacity:.5;cursor:not-allowed}
.lesson.locked:hover{transform:none;box-shadow:none;border-color:var(--line)}
.lesson .lt{font-size:13.6px;font-weight:750;display:flex;align-items:center;gap:6px}
.lesson .lk{font-size:11.5px;color:var(--ink-3);font-weight:650}
.lesson .stars{font-size:13px;letter-spacing:1px}
.lesson .badge-num{font-size:10.5px;font-weight:800;color:var(--ink-3);letter-spacing:.06em}
.lesson.done{background:linear-gradient(180deg,var(--ok-soft),var(--surface-2));border-color:#86efac55}
.lesson.review{background:linear-gradient(180deg,#fef3c7,var(--surface-2));border-color:var(--gold)}
html[data-theme="dark"] .lesson.review{background:linear-gradient(180deg,#3b2f0d,var(--surface-2))}
.lesson.review .badge-num{color:#b45309}
.keychips{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.keychip{font-family:var(--mono);font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--surface);border:1px solid var(--line)}

/* ---------- Pràctica ---------- */
.lessonbar{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.lessonbar .title{font-size:20px;font-weight:800;letter-spacing:-.02em}
.lessonbar .chip{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:99px;color:#fff;letter-spacing:.03em}
.live{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.live .m{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:7px 14px;text-align:center;min-width:86px;box-shadow:var(--shadow)}
.live .m b{display:block;font-size:20px;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.live .m span{font-size:10px;color:var(--ink-3);font-weight:800;text-transform:uppercase;letter-spacing:.07em}
.live .m.good b{color:var(--ok)} .live .m.bad b{color:var(--bad)}

.progline{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:16px}
.progline i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--primary),#ec4899);transition:width .12s linear}

.typebox{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:22px;
  padding:30px 32px;box-shadow:var(--shadow);min-height:170px;max-height:280px;overflow:hidden
}
.typescroll{max-height:220px;overflow:hidden}
.text{
  font-family:var(--mono);font-size:26px;line-height:2.05;letter-spacing:.5px;
  color:var(--ink-3);overflow-wrap:break-word;white-space:pre-wrap;
  transition:transform .18s ease
}
.text.sz-s{font-size:21px;line-height:2.1}
.text.sz-l{font-size:32px;line-height:1.95}
.text span{transition:color .08s,background .08s;border-radius:5px;padding:1px 0}
.text .ok{color:var(--ok)}
.text .err{color:#fff;background:var(--bad)}
.text .cur{
  background:var(--primary);color:#fff;
  box-shadow:0 0 0 4px color-mix(in srgb,var(--primary) 22%,transparent);
  animation:blink 1.1s ease-in-out infinite
}
.text .sp{border-bottom:2px solid var(--line)}
.text .sp.ok{border-bottom-color:#86efac}
.text .sp.cur{background:var(--primary);border-radius:4px}
.text .sp.err{background:var(--bad)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.62}}
.shake{animation:shake .25s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.focusmask{
  position:absolute;inset:0;border-radius:22px;background:color-mix(in srgb,var(--surface) 78%,transparent);
  backdrop-filter:blur(3px);display:grid;place-items:center;gap:8px;cursor:pointer;z-index:5;
  font-weight:750;color:var(--ink-2);text-align:center;padding:20px
}
.focusmask .big{font-size:19px;color:var(--ink)}
#hidden-input{position:absolute;opacity:0;pointer-events:none;left:-9999px;top:0;width:10px;height:10px}

.hint{
  display:flex;align-items:center;gap:10px;justify-content:center;margin:16px 0 6px;
  font-weight:700;font-size:14.5px;color:var(--ink-2);flex-wrap:wrap
}
.hint .kbig{
  font-family:var(--mono);font-size:22px;font-weight:800;color:#fff;min-width:46px;height:46px;
  display:grid;place-items:center;border-radius:12px;padding:0 12px
}
.hint .fname{padding:5px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px}

/* ---------- Teclat ---------- */
.kbwrap{margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:14px}
.keyboard{
  width:100%;max-width:900px;background:var(--surface);border:1px solid var(--line);
  border-radius:18px;padding:12px;box-shadow:var(--shadow);user-select:none
}
.krow{display:flex;gap:5px;margin-bottom:5px}
.krow:last-child{margin-bottom:0}
.key{
  flex:1 1 0;min-width:0;height:44px;border-radius:9px;background:var(--surface-2);
  border:1px solid var(--line);border-bottom-width:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13.5px;font-weight:700;color:var(--ink-2);
  position:relative;transition:transform .06s, background .12s, color .12s, box-shadow .12s
}
.key .sh{font-size:9px;opacity:.55;line-height:1;margin-bottom:1px}
.key .mn{line-height:1}
.key.mod{font-size:10.5px;font-family:var(--font);font-weight:800;color:var(--ink-3)}
.key.next{
  color:#fff !important;transform:translateY(1px) scale(1.04);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--kc,#6d5efc) 26%,transparent), 0 6px 14px -6px var(--kc,#6d5efc);
  z-index:2
}
.key.press{transform:translateY(2px) scale(.96);filter:brightness(1.15)}
.key.bump:after{content:"";position:absolute;bottom:5px;width:15px;height:3px;border-radius:9px;background:currentColor;opacity:.55}
.key.wrongk{background:var(--bad) !important;color:#fff !important}
.key[data-tint="1"]{background:color-mix(in srgb,var(--kc) 14%,var(--surface-2));border-color:color-mix(in srgb,var(--kc) 35%,var(--line))}

/* ---------- Mans ---------- */
.hands{width:100%;max-width:560px}
.hands svg{width:100%;height:auto;display:block}
.finger{fill:var(--surface-2);stroke:var(--line);stroke-width:2;transition:.15s}
.palm{fill:var(--surface-2);stroke:var(--line);stroke-width:2}
.finger.on{stroke:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.18))}
.handlabel{font-size:11px;font-weight:800;fill:var(--ink-3);font-family:var(--font);letter-spacing:.06em}

.legend{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.legend div{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink-2)}
.legend i{width:12px;height:12px;border-radius:4px;display:block}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,12,45,.55);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:200;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border-radius:26px;padding:30px;max-width:520px;width:100%;
  box-shadow:var(--shadow-lg);text-align:center;animation:pop .3s cubic-bezier(.2,1.3,.4,1)
}
@keyframes pop{from{transform:scale(.88) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:26px;letter-spacing:-.02em;margin-bottom:4px}
.modal .sub{color:var(--ink-3);font-size:14px;margin-bottom:18px}
.bigstars{font-size:38px;letter-spacing:3px;margin:4px 0 4px;white-space:nowrap}

/* Marcador: velocitat i precisió per separat, i la nota final */
.scoreboard{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 12px}
.scoreitem{background:var(--surface-2);border-radius:16px;padding:13px 8px}
.si-lbl{font-size:11px;font-weight:850;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em}
.si-stars{font-size:20px;letter-spacing:1px;margin:7px 0 4px;white-space:nowrap}
.si-note{font-size:12px;font-weight:750;color:var(--ink-2)}
.si-sub{font-size:10.5px;font-weight:700;color:var(--ink-3);margin-top:3px}
.totalbox{border-top:2px dashed var(--line);padding-top:12px;margin-bottom:14px}
.totalbox .t-lbl{font-size:11px;font-weight:850;color:var(--ink-3);letter-spacing:.14em}
.bigstars span{display:inline-block;animation:starp .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes starp{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.resgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:6px 0 18px}
.resgrid div{background:var(--surface-2);border-radius:14px;padding:12px 8px}
.resgrid b{display:block;font-size:21px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.resgrid span{font-size:10.5px;color:var(--ink-3);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.modal .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.xpline{background:var(--surface-2);border-radius:12px;padding:10px 14px;font-size:13.5px;font-weight:700;margin-bottom:16px;color:var(--ink-2)}

/* ---------- Assoliments ---------- */
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ach{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:center;box-shadow:var(--shadow);transition:.15s}
.ach .ico{font-size:32px;filter:grayscale(1);opacity:.35;transition:.2s}
.ach.on{border-color:var(--gold);background:linear-gradient(180deg,#fffbeb,var(--surface))}
html[data-theme="dark"] .ach.on{background:linear-gradient(180deg,#3b2f0d,var(--surface))}
.ach.on .ico{filter:none;opacity:1;transform:scale(1.12)}
.ach b{display:block;font-size:13.5px;margin-top:8px}
.ach span{font-size:11.5px;color:var(--ink-3);display:block;margin-top:3px;line-height:1.4}

/* ---------- Progrés ---------- */
.chartcard{padding:20px 22px}
.chart{width:100%;height:210px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--primary);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:url(#gradA);opacity:.25}
.chart .dot{fill:var(--primary)}
.chart text{font-size:10px;fill:var(--ink-3);font-weight:700;font-family:var(--font)}
.chart .goal{stroke:var(--ok);stroke-dasharray:5 5;stroke-width:2}

.tablekeys{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tablekeys div{background:var(--bad-soft);border-radius:11px;padding:8px 13px;font-weight:800;font-family:var(--mono);font-size:15px;color:var(--bad);display:flex;align-items:center;gap:7px}
.tablekeys div small{font-family:var(--font);font-size:11px;opacity:.75}

/* ---------- Joc ---------- */
.gamearea{
  position:relative;height:430px;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,#0f1030,#2a1b52 60%,#4c1d95);border:1px solid var(--line);box-shadow:var(--shadow)
}
.gamearea .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:99px;opacity:.6}
.fword{
  position:absolute;font-family:var(--mono);font-size:19px;font-weight:800;color:#fff;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);padding:6px 13px;border-radius:12px;
  white-space:nowrap;backdrop-filter:blur(3px)
}
.fword .hit{color:#5eead4}
.fword.boom{animation:boom .3s forwards}
@keyframes boom{to{transform:scale(1.7);opacity:0}}
.gamehud{display:flex;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.gameinput{
  font-family:var(--mono);font-size:18px;padding:12px 18px;border-radius:14px;border:2px solid var(--line);
  background:var(--surface);color:var(--ink);width:260px;font-weight:700;outline:none
}
.gameinput:focus{border-color:var(--primary)}

/* ---------- Ajustos ---------- */
.setrow{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow .lbl{font-weight:700;font-size:14.5px}
.setrow .dsc{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.setrow .ctl{margin-left:auto}
.toggle{width:50px;height:29px;border-radius:99px;background:var(--line);position:relative;transition:.2s;flex:none}
.toggle:after{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:99px;background:#fff;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.toggle.on{background:var(--primary)}
.toggle.on:after{left:24px}
select.sel{padding:9px 13px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-weight:700;font-size:13.5px}

.avatars{display:flex;gap:8px;flex-wrap:wrap}
.avatars button{width:46px;height:46px;border-radius:14px;font-size:24px;background:var(--surface-2);border:2px solid var(--line);display:grid;place-items:center;transition:.15s}
.avatars button:hover{transform:scale(1.08)}
.avatars button.on{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--surface))}

/* ---------- Diploma ---------- */
.cert{
  background:linear-gradient(160deg,#fffdf5,#fff);border:10px double var(--gold);border-radius:12px;
  padding:38px;text-align:center;color:#3b2f00;box-shadow:var(--shadow-lg)
}
.cert h2{font-size:32px;letter-spacing:.04em;margin-bottom:4px}
.cert .nm{font-size:40px;font-weight:850;margin:16px 0;color:#7c3aed;letter-spacing:-.02em}
.cert p{font-size:15px;line-height:1.7;max-width:52ch;margin:0 auto}
.cert .seal{font-size:56px;margin:14px 0}

/* ---------- Confeti i trofeu ---------- */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:900}
#confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;opacity:0;will-change:transform}
@keyframes fall{
  0%{opacity:1;transform:translate3d(0,-20px,0) rotate(0deg)}
  100%{opacity:0;transform:translate3d(var(--dx),102vh,0) rotate(var(--rot))}
}
.trophy{text-align:center}
.trophy .cup{font-size:82px;line-height:1;animation:cupin .7s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 10px 22px rgba(251,191,36,.55))}
@keyframes cupin{0%{transform:scale(0) rotate(-25deg)}60%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
.trophy .ribbon{
  display:inline-block;margin:16px 0 6px;padding:10px 22px;border-radius:99px;color:#fff;font-weight:850;
  font-size:16px;letter-spacing:-.01em;box-shadow:var(--shadow);animation:pop .45s .2s cubic-bezier(.2,1.3,.4,1) both
}
.trophy .rays{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:26px}
.trophy .rays:before{
  content:"";position:absolute;left:50%;top:76px;width:340px;height:340px;margin:-170px 0 0 -170px;
  border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gold) 40%,transparent) 0%,transparent 68%);
  animation:glow 2.8s ease-in-out infinite
}
@keyframes glow{0%,100%{transform:scale(.92);opacity:.75}50%{transform:scale(1.08);opacity:1}}

.tip{background:color-mix(in srgb,var(--primary) 8%,var(--surface));border:1px solid color-mix(in srgb,var(--primary) 25%,var(--line));border-radius:16px;padding:14px 18px;font-size:13.5px;line-height:1.6;color:var(--ink-2);display:flex;gap:12px}
.tip b{color:var(--ink)}

.newkeys{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.nk{border-radius:16px;padding:14px 18px;color:#fff;text-align:center;min-width:110px;box-shadow:var(--shadow)}
.nk .k{font-family:var(--mono);font-size:30px;font-weight:850;line-height:1}
.nk .f{font-size:11.5px;font-weight:800;opacity:.92;margin-top:5px;letter-spacing:.03em}

@media (max-width:980px){
  .hero{grid-template-columns:1fr}
  .rail{flex-direction:row}
  .rail>*{flex:1}
  .statgrid{grid-template-columns:repeat(2,1fr)}
  .text{font-size:21px}
  nav.tabs button span.tx{display:none}
  .key{height:38px;font-size:12px}
}
@media print{
  header.top,nav.tabs,.noprint{display:none !important}
  body{background:#fff}
}
</style>
</head>
<body>
<div class="app">

  <header class="top">

      <div class="logo">⌨️</div>
      <div>
        <small data-i18n="brandSub"></small>

      </div>

    <div class="langsel" id="langsel"></div>

      </div>

  <!-- ============ INICI ============ -->

            <button class="btn solid big" id="btnContinue"></button>
            <button class="btn big" id="btnGoCourse" data-i18n="seeCourse"></button>
          </div>
        </div>

        <div class="statgrid">
          <div class="stat">
            <div class="sico" style="background:color-mix(in srgb,#6d5efc 16%,transparent)">📚</div>

            <b id="sStars">0</b>
            <div class="lblrow"><span data-i18n="stStars"></span><em id="sStarsPct">0 %</em></div>
            <div class="minibar"><i id="sStarsBar" style="background:linear-gradient(90deg,#f59e0b,#fbbf24)"></i></div>
          </div>

      <div class="rail">

              <path d="M14 106 A86 86 0 0 1 186 106" fill="none" stroke="var(--line)" stroke-width="17" stroke-linecap="round"/>
              <path id="gaugeArc" d="M14 106 A86 86 0 0 1 186 106" fill="none" stroke="url(#gg)" stroke-width="17" stroke-linecap="round" stroke-dasharray="270" stroke-dashoffset="270"/>
              <defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#6d5efc"/><stop offset=".5" stop-color="#ec4899"/><stop offset="1" stop-color="#f59e0b"/>
              </linearGradient></defs>
            </svg>
            <div class="val" id="gaugeVal">0</div>
            <div class="lbl" data-i18n="gaugeLbl"></div>
          </div>
          <div class="goalmsg" id="goalMsg"></div>
        </div>

        <div class="card dose" id="recCard"></div>
      </div>
    </div>

    <h2 class="sec" data-i18n="continueHere"></h2>

    <h2 class="sec" data-i18n="tipsTitle"></h2>
    <div class="card pad" style="display:grid;gap:12px" id="tipsCard"></div>
  </section>

  <!-- ============ PERFILS ============ -->

  <!-- ============ CURS ============ -->

      <div class="setrow">

        <div class="ctl"><div class="toggle" data-set="showHands"></div></div>

      <div class="setrow">

        <div class="ctl"><div class="toggle" data-set="sound"></div></div>

      <div class="setrow">
        <div><div class="lbl" data-i18n="setStrict"></div><div class="dsc" data-i18n-html="setStrictD"></div></div>

      </div>
      <div class="setrow">

let DB=loadDB();
let S=DB.profiles.find(p=>p.id===DB.active)||DB.profiles[0]||null;

function loadDB(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY_DB));
    if(r&&Array.isArray(r.profiles)&&r.profiles.length){
      r.profiles.forEach(p=>{ p.set=Object.assign({},DEF.set,p.set||{}); if(!p.lang) p.lang=defaultLang(); });
      return r;
    }
  }catch(e){}
  /* migració des de la versió d'un sol usuari */
  try{
    const old=JSON.parse(localStorage.getItem(KEY));
    if(old&&old.prog){
      const p=Object.assign({},JSON.parse(JSON.stringify(DEF)),old);
      p.set=Object.assign({},DEF.set,old.set||{});
      p.id=uid(); p.created=Date.now();
      if(!p.name) p.name="Bruna";
      if(!p.lang) p.lang=defaultLang();
      return {v:1,active:p.id,profiles:[p]};
    }
  }catch(e){}
  return {v:1,active:null,profiles:[]};
}
function save(){
  if(S) DB.active=S.id;
  try{ localStorage.setItem(KEY_DB,JSON.stringify(DB)); return true; }
  catch(e){ alert(t("storageFull")); return false; }
}
function switchTo(id){
  const p=DB.profiles.find(x=>x.id===id);
  if(!p) return;
  stopPractice(); stopGame();
  S=p; DB.active=id; save();
  applySettings(); applyI18n();
  renderHome(); renderCourse(); renderAch(); renderStats(); renderSettings();
  show("home");
}

const LEVELS=[0,60,150,280,450,680,960,1300,1700,2200,2800,3500,4300,5200,6200,7300,8500,9900,11500,13500,16000];
function levelOf(xp){let l=1;for(let i=0;i<LEVELS.length;i++) if(xp>=LEVELS[i]) l=i+1; return l;}
function levelProgress(xp){
  const l=levelOf(xp), a=LEVELS[l-1]??0, b=LEVELS[l]??(a+3000);
  return Math.max(0,Math.min(100,((xp-a)/(b-a))*100));
}

function fits(w,set){for(const c of w) if(!set.has(c)) return false; return true;}

/* target = nombre de caràcters desitjat, no de paraules.
   focus = tecles que la lliçó vol reforçar: les paraules que en contenen
   surten més sovint, perquè practicar-les dins de paraules de veritat és
   el que fa que la tecla acabi sortint sola. */
function pickWords(u,target,min,max,focus){
  const set=allowed(u);
  let pool=C().WORDS.filter(w=>w.length>=(min||1)&&w.length<=(max||99)&&fits(w,set));
  pool=[...new Set(pool)];
  if(pool.length<6) return null;
  if(focus&&focus.length){
    const hit=pool.filter(w=>focus.some(k=>w.includes(k)));
    if(hit.length>=4) pool=pool.concat(hit,hit);      // pesen el triple
  }
  const next=bagPicker(pool);
  let last="";
  return untilTarget(()=>{ let w=next(); if(w===last) w=next(); last=w; return w; },target);
}
function drill(pool,focus,groups,minL,maxL){
  const chars=pool.split("");
  const out=[];
  for(let g=0;g<groups;g++){
    const len=minL+Math.floor(Math.random()*(maxL-minL+1));
    let s="";
    for(let i=0;i<len;i++){
      if(focus&&focus.length&&Math.random()<0.6) s+=rnd(focus);
      else s+=rnd(chars);
    }
    out.push(s);
  }
  return out.join(" ");
}
/* ------------------------------------------------------------------
   Escales: la seqüència ordenada de cada fila, del dit petit a l'índex,
   tal com s'ensenyava a les acadèmies (ASDFG… ÑLKJH…).
   No cal llegir-la, i això deixa tota l'atenció per als dits; a més
   garanteix que cada dit treballa exactament igual, cosa que l'atzar no.
------------------------------------------------------------------ */
const ROW_RUNS=[
  {L:"asdfg", R:"ñlkjh"},    // fila guia
  {L:"qwert", R:"poiuy"},    // fila de dalt
  {L:"zxcvb", R:"-.,mn"},    // fila de baix
  {L:"12345", R:"09876"}     // números
];
function runsFor(poolStr,focus){
  const has=new Set(poolStr.split("")), out=[];
  for(const row of ROW_RUNS){
    for(const side of ["L","R"]){
      const seq=[...row[side]].filter(c=>has.has(c)).join("");
      if(seq.length>=3) out.push(seq);
    }
  }
  /* Primer les escales que contenen les tecles noves de la lliçó */
  if(focus&&focus.length){
    out.sort((a,b)=>(focus.some(k=>b.includes(k))?1:0)-(focus.some(k=>a.includes(k))?1:0));
  }
  return out;
}
/* La tecla de repòs de cada dit a la fila guia */
const HOME_KEY={L5:"a",L4:"s",L3:"d",L2:"f",R2:"j",R3:"k",R4:"l",R5:"ñ"};
/* Combinacions de files: anar de la fila guia a la tecla nova i tornar.
   Els manuals ho tracten com un exercici a part perquè és exactament on
   es concentren les errades: en el viatge del dit, no en la tecla. */
function transitionTokens(keys){
  const out=[];
  (keys||[]).forEach(k=>{
    if(!k||k.length!==1) return;
    const h=HOME_KEY[fingerOf(k)];
    if(!h||h===k) return;
    out.push(h+k+h, k+h+k, h+k+h+k);
  });
  return out;
}

/* Escala repetida endavant i enrere, que és com s'entrena el moviment */
function scaleTokens(runs,reps){
  const out=[];
  runs.forEach(s=>{
    for(let i=0;i<(reps||3);i++) out.push(s);
    out.push([...s].reverse().join(""));
  });
  return out;
}

function cumulativePool(idx){
  let p="";
  for(const l of LESSONS){ if(l.id>idx) break; if(l.mode==="keys"&&l.k.length) p+=l.k.join(""); }
  if(!p) p="fj";
  return [...new Set(p.split(""))].join("");
}

/* ------------------------------------------------------------------
   Quant ha de durar un exercici?
   Un test de mecanografia necessita com a mínim un minut per donar una
   mesura fiable: per sota, una sola vacil·lació ja et canvia el resultat.
   I per dalt, una criatura de vuit anys manté la postura i l'atenció uns
   dos minuts llargs; més estona no ensenya més, només cansa.
   Per això la llargada no és fixa: s'ajusta a la velocitat de cadascú
   perquè totes les lliçons durin si fa no fa el mateix. Amb una llargada
   fixa, les primeres lliçons se li fan eternes i les últimes duren
   quaranta segons, massa poc per mesurar res.
------------------------------------------------------------------ */
/* Els exercicis es mesuren en TEMPS, no en caràcters: així duren el mateix
   tant si escrius a 40 pulsacions com si vas a 250, i cadascú fa el mateix
   esforç. Amb una llargada fixa de caràcters passava el contrari. */
const EX_LEN={
  short: {sec:150},   // 2:30 · per als més petits o els dies de poca paciència
  normal:{sec:240},   // 4:00 · per defecte a partir dels vuit anys
  long:  {sec:360}    // 6:00 · exercici de pàgina sencera, com als manuals de tota la vida
};
const CHAR_FLOOR=90, CHAR_CEIL=1200;
/* Per defecte, segons l'edat del perfil */
function defaultExLen(age){
  if(!age) return "normal";
  if(age<=7)  return "short";
  if(age<=12) return "normal";
  return "long";
}
function recentSpeed(){
  const h=S.hist.slice(-5).map(x=>x.gross||x.ppm||0).filter(v=>v>0).sort((a,b)=>a-b);
  if(!h.length) return 40;                       // principiant absolut
  const med=h[Math.floor(h.length/2)];           // mediana: una sessió rara no desvia la llargada
  return Math.max(25,Math.min(400,Math.round(med)));
}
function exLenKey(){
  const s=(S&&S.set.exLen)||"auto";
  return (s==="auto"||!EX_LEN[s])?defaultExLen(S&&S.age):s;
}
function targetSeconds(){ return EX_LEN[exLenKey()].sec; }
function targetChars(l){
  let n=Math.round(recentSpeed()*targetSeconds()/60);
  n=Math.max(CHAR_FLOOR,Math.min(CHAR_CEIL,n));
  /* Un repte necessita com a mínim minut i mig a la velocitat que exigeix */
  if(l&&l.challenge) n=Math.max(n,Math.round(l.challenge*90/60));
  return n;
}
/* Va encadenant trossos fins a arribar a la llargada desitjada */
function untilTarget(makeToken,target){
  const out=[]; let len=0;
  while(len<target&&out.length<500){
    const tk=String(makeToken(out.length));
    if(!tk) break;
    out.push(tk); len+=tk.length+1;
  }
  return out.join(" ");
}
/* Les tecles que més falla, per reforçar-les dins dels exercicis.
   Només les que ja s'han ensenyat en aquesta lliçó, és clar. */
function weakKeys(poolStr,n){
  const has=new Set(poolStr.split(""));
  return Object.entries(S.keyErr||{})
    .filter(([k,v])=>has.has(k)&&v>=3)
    .sort((a,b)=>b[1]-a[1])
    .slice(0,n||3).map(([k])=>k);
}

/* Reparteix una llista sense repetir fins que s'acaba, i llavors la remena */
function bagPicker(list){
  let bag=[];
  return ()=>{ if(!bag.length) bag=shuffle(list); return bag.pop(); };
}

function buildText(l){
  const u=l.u, D=C(), TG=targetChars(l);
  switch(l.mode){
    /* Escales pures: la lliçó sencera és la seqüència ordenada */
    case "rows":{
      const runs=runsFor(l.pool||cumulativePool(l.id),l.k);
      if(!runs.length) return untilTarget(()=>rnd((l.pool||"asdf").split("")),TG);
      const tk=scaleTokens(runs,4);
      let i=0;
      return untilTarget(()=>tk[i++%tk.length],TG);
    }
    case "keys":{
      const poolStr=l.pool||cumulativePool(l.id);
      const pool=poolStr.split("");
      const weak=weakKeys(poolStr,3);
      const random=()=>{
        let src;
        /* Una part dels grups es fan amb les tecles que més li costen:
           és el que faria un professor que se n'adona. */
        if(weak.length&&Math.random()<0.22)          src=weak.concat(pool.slice(0,2));
        else if(l.k&&l.k.length&&Math.random()<0.6)  src=l.k;      // les tecles noves
        else                                         src=pool;     // tot el que ja sap
        const len=3+Math.floor(Math.random()*2);
        let s="";
        for(let i=0;i<len;i++) s+=rnd(src);
        return s;
      };
      /* Tres fases, com als manuals: primer l'escala (moviment ordenat),
         després el viatge fila guia ↔ tecla nova, i finalment grups a
         l'atzar, que és quan cal recordar de veritat on és cada tecla. */
      const parts=[];
      let budget=TG;
      const add=(tokens,frac)=>{
        if(!tokens.length||budget<60) return;
        let i=0;
        const s=untilTarget(()=>tokens[i++%tokens.length],Math.round(TG*frac));
        if(s){ parts.push(s); budget-=s.length+1; }
      };
      add(scaleTokens(runsFor(poolStr,l.k),3),0.22);
      add(transitionTokens(l.k),0.20);
      parts.push(untilTarget(random,Math.max(50,budget)));
      return parts.join(" ").trim();
    }
    case "words":
      return pickWords(u,TG,1,99,weakKeys(cumulativePool(l.id),3))||drill(cumulativePool(l.id),[],24,3,4);
    case "wordsLen":
      return pickWords(u,TG,l.min||1,l.max||99,weakKeys(cumulativePool(l.id),3))||pickWords(u,TG)||drill("asdfjklñ",[],24,3,4);
    case "wordsAcc":{
      const acc=D.WORDS_ACC||[];
      const pool=acc.length?acc.concat(D.WORDS.filter(w=>w.length>4)):D.WORDS.filter(w=>w.length>=6);
      const next=bagPicker([...new Set(pool)]);
      return untilTarget(next,TG);
    }
    case "bigrams":
      return untilTarget(()=>rnd(D.BIGRAMS)+rnd(D.BIGRAMS),TG);
    case "sent":{
      const set=allowed(l.minU||u);
      let pool=D.SENTENCES.filter(s=>fits(s,set));
      if(pool.length<3) pool=D.SENTENCES.filter(s=>fits(s,allowed(4)));
      if(pool.length<3) pool=D.SENTENCES.filter(s=>fits(s,allowed(6)));
      const next=bagPicker(pool);
      return untilTarget(next,TG);
    }
    case "text":{
      let out=D.TEXTS[l.ix%D.TEXTS.length].x;
      /* Als reptes encadenem paràgrafs fins a tenir mostra suficient:
         un examen de 58 segons no certifica res. A la unitat 9 no, que allà
         el que toca és llegir un text sencer, no fer una marató. */
      if(l.challenge){
        const need=Math.max(220,Math.round(l.challenge*110/60));
        let i=1;
        while(out.length<need&&i<D.TEXTS.length){
          out+=" "+D.TEXTS[(l.ix+i)%D.TEXTS.length].x; i++;
        }
      }
      return out;
    }
    case "upperL":
      return untilTarget(()=>{ const L=rnd("QWERTASDFGZXCVB".split("")); return L+L.toLowerCase()+L+L.toLowerCase(); },TG);
    case "upperR":{
      let letters="YUIOPHJKLNM";
      if(S.lang==="es") letters+="Ñ"; if(S.lang==="ca") letters+="Ç";
      const a=letters.split("");
      return untilTarget(()=>{ const L=rnd(a); return L+L.toLowerCase()+L+L.toLowerCase(); },TG);
    }
    case "names":{
      const next=bagPicker(D.NAMES);
      return untilTarget(next,TG);
    }
    case "accents":{
      const s=ACC_SETS[S.lang][l.accIx];
      if(!s){                                   // anglès: contraccions amb apòstrof
        const next=bagPicker(D.CONTR||[]);
        return untilTarget(next,TG);
      }
      const base={"á":"a","é":"e","í":"i","ó":"o","ú":"u","à":"a","è":"e","ò":"o","ï":"i","ü":"u"};
      const chars=s.split("");
      const words=(D.WORDS_ACC||[]).filter(x=>chars.some(c=>x.includes(c)));
      const nextW=bagPicker(words.length?words:D.WORDS);
      /* Primer dos terços de repeticions de la tecla, i després paraules
         de veritat que la contenen: de la mecànica a l'ús real. */
      return untilTarget(i=>{
        if(i<Math.round(TG/9)) { const c=rnd(chars); return c+base[c]+c+base[c]; }
        return nextW();
      },TG);
    }
    case "punct":{
      const set=l.set.split("");
      const nextW=bagPicker(D.WORDS.filter(w=>w.length>3&&w.length<8));
      return untilTarget(()=>{
        const c=rnd(set), w=nextW();
        if(c==="¿") return "¿"+w+"?";
        if(c==="¡") return "¡"+w+"!";
        if("?!".includes(c)) return w+c;
        if(c==="("||c===")") return "("+w+")";
        if(c==='"') return '"'+w+'"';
        return w+c;
      },TG);
    }
    case "numbers":
      return untilTarget(()=>{
        const r=Math.random();
        if(r<.33) return Math.floor(Math.random()*28+1)+"-"+Math.floor(Math.random()*12+1)+"-20"+(10+Math.floor(Math.random()*16));
        if(r<.66) return Math.floor(Math.random()*900+100)+","+Math.floor(Math.random()*90+10);
        return String(Math.floor(Math.random()*90000+1000));
      },TG);
  }
  return "asdf jklñ";
}

   ============================================================ */
const CHARKEY={}; const SHIFT_L=[], SHIFT_R=[];
function buildKeyboard(){
  const kb=document.getElementById("keyboard");
  kb.innerHTML="";
  for(const row of KB_ROWS){
    const r=document.createElement("div"); r.className="krow";
    for(const [main,alt,f,w,home] of row){
      const k=document.createElement("div");
      const isMod=main.length>1||["⌫","⏎","⇥","⇪","⇧"].includes(main);
      k.className="key"+(isMod?" mod":"")+(main==="f"||main==="j"?" bump":"");
      k.style.flexGrow=w; k.style.flexBasis="0";
      k.style.setProperty("--kc",FINGERS[f].c);
      if(home) k.dataset.tint="1";
      if(main===" "){ k.innerHTML='<span class="mn">espai</span>'; k.classList.add("mod"); k.id="key-space"; }
      else if(isMod){ k.innerHTML='<span class="mn">'+main+"</span>"; }
      else{
        k.innerHTML=(alt&&alt!==main.toUpperCase()?'<span class="sh">'+alt+"</span>":'<span class="sh">&nbsp;</span>')+
                    '<span class="mn">'+main+"</span>";
      }
      k.dataset.f=f;
      r.appendChild(k);
      if(main.length===1&&main!==" ") CHARKEY[main]={el:k,f:f,sh:false};
      if(main===" ") CHARKEY[" "]={el:k,f:"TH",sh:false};
      if(alt&&alt.length===1) CHARKEY[alt]={el:k,f:f,sh:true};
      if(main.length===1&&/[a-zñç]/.test(main)) CHARKEY[main.toUpperCase()]={el:k,f:f,sh:true};
      if(main==="⇧"){ (f==="L5"?SHIFT_L:SHIFT_R).push(k); }
    }
    kb.appendChild(r);
  }
}
function clearKb(){
  document.querySelectorAll(".key.next").forEach(k=>{k.classList.remove("next");k.style.background="";});
  document.querySelectorAll(".key.wrongk").forEach(k=>k.classList.remove("wrongk"));
}
function highlightChar(ch){
  clearKb();
  (keyPlan(ch)||[]).forEach(p=>{
    if(!p.el) return;
    p.el.classList.add("next");
    p.el.style.background=FINGERS[p.f].c;
    p.el.style.setProperty("--kc",FINGERS[p.f].c);
  });
}
function pushKey(out,ch){
  const k=CHARKEY[ch]; if(!k) return;
  if(k.sh){
    const left=k.f.startsWith("L");
    const se=left?SHIFT_R[0]:SHIFT_L[0];
    if(se) out.push({el:se,f:left?"R5":"L5",label:"⇧"});
  }
  out.push({el:k.el,f:k.f,label:ch});
}
function keyPlan(ch){
  const out=[];
  if(DEAD[ch]){ const [d,base]=DEAD[ch]; pushKey(out,d); pushKey(out,base); return out.length?out:null; }
  if(!CHARKEY[ch]) return null;
  pushKey(out,ch);
  return out;
}
function fingerOf(ch){ const p=keyPlan(ch); return p&&p.length?p[p.length-1].f:null; }

   7. SO
   ============================================================ */
let AC=null, NOISE=null;
function ac(){
  if(!S||!S.set.sound) return null;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended") AC.resume();
    if(!NOISE){                       // un sol buffer de soroll, reaprofitat sempre
      const n=Math.floor(AC.sampleRate*0.25);
      NOISE=AC.createBuffer(1,n,AC.sampleRate);
      const d=NOISE.getChannelData(0);
      for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
    }
    return AC;
  }catch(e){ return null; }
}
/* Cop sec de soroll filtrat: és el que fa que soni a martell i no a pip */
function burst(ctx,t,freq,q,gain,dur,type){
  const src=ctx.createBufferSource(); src.buffer=NOISE;
  src.playbackRate.value=0.75+Math.random()*0.6;
  const f=ctx.createBiquadFilter(); f.type=type||"bandpass"; f.frequency.value=freq; f.Q.value=q;
  const g=ctx.createGain();
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(gain,t+0.001);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  src.connect(f); f.connect(g); g.connect(ctx.destination);
  src.start(t); src.stop(t+dur+0.02);
}
/* Cos greu del cop: la caixa de la màquina ressonant */
function thump(ctx,t,freq,gain,dur,type){
  const o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type||"triangle";
  o.frequency.setValueAtTime(freq,t);
  o.frequency.exponentialRampToValueAtTime(freq*0.55,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(gain,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(t); o.stop(t+dur+0.02);
}
function beep(freq,dur,type,vol){
  const ctx=ac(); if(!ctx) return;
  thump(ctx,ctx.currentTime,freq,vol||0.06,dur||0.06,type||"sine");
}

/* Tecla de màquina d'escriure. La barra d'espai sona més greu i més llarga,
   i cada cop varia una mica perquè no soni a bucle. */
function sClick(ch){
  const ctx=ac(); if(!ctx) return;
  const t=ctx.currentTime, sp=(ch===" "), v=0.8+Math.random()*0.4;
  if(sp){
    burst(ctx,t,1000+Math.random()*350,0.7,0.085*v,0.080);
    thump(ctx,t,92+Math.random()*18,0.055*v,0.095);
  }else{
    burst(ctx,t,2000+Math.random()*1000,0.9,0.105*v,0.045);          // el clac
    burst(ctx,t+0.004,5000+Math.random()*1800,1.2,0.035*v,0.018,"highpass"); // el tic metàl·lic
    thump(ctx,t,160+Math.random()*40,0.045*v,0.055);                 // la caixa
  }
}
/* Errada: soroll sord, com una tecla encallada */
function sErr(){
  const ctx=ac(); if(!ctx) return;
  const t=ctx.currentTime;
  burst(ctx,t,400,0.6,0.085,0.14);
  thump(ctx,t,105,0.065,0.17,"square");
}
/* Timbre de final de línia: el "ding" de tota la vida */
function sBell(){
  const ctx=ac(); if(!ctx) return;
  const t=ctx.currentTime;
  [[2093,0.075],[3136,0.030],[4186,0.014]].forEach(([f,vol])=>{
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.linearRampToValueAtTime(vol,t+0.004);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.2);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t+1.3);
  });
}
function sWin(stars){
  [523,659,784,1047].slice(0,Math.max(2,stars+1)).forEach((n,i)=>setTimeout(()=>beep(n,0.18,"triangle",0.07),i*110));
}

const REAL_MODES=new Set(["words","wordsLen","wordsAcc","sent","text","names"]);
const countsForRecord=l=>!!l&&REAL_MODES.has(l.mode);
/* Rècord oficial: només compta amb text real (la meta de 300 ppm ha de ser honesta) */
function bestPpm(){
  let m=0;
  for(const id in S.prog) if(countsForRecord(LESSONS[Number(id)-1])) m=Math.max(m,S.prog[id].ppm||0);
  return m;
}
/* Millor marca de qualsevol lliçó, inclosos els exercicis de tecles.
   Serveix per no ensenyar mai un 0 a qui ja ha practicat. */
function bestAnyPpm(){
  let m=0;
  for(const id in S.prog) m=Math.max(m,S.prog[id].ppm||0);
  return m;
}
const doneCount=()=>Object.values(S.prog).filter(p=>p.done).length;
const starCount=()=>Object.values(S.prog).reduce((a,p)=>a+(p.stars||0),0);
function avgAcc(){ const h=S.hist.slice(-20); return h.length?Math.round(h.reduce((a,x)=>a+x.acc,0)/h.length):null; }
function nextLesson(){ for(const l of LESSONS){ const p=S.prog[l.id]; if(!p||!p.done) return l; } return LESSONS[LESSONS.length-1]; }
function isUnlocked(l){
  if(S.set.unlockAll) return true;
  if(l.id===1) return true;
  const prev=S.prog[l.id-1];
  return !!(prev&&prev.done);
}
const shortTime=s=>s<60?Math.round(s)+" s":Math.round(s/60)+" min";

/* Minuts diaris recomanats segons l'edat */
function dailyMinutes(age){
  if(!age) return 15;
  if(age<=7) return 8;
  if(age<=10) return 12;
  if(age<=13) return 18;
  return 25;
}

function updateCursor(){
  P.spans.forEach((s,i)=>{ if(i!==P.idx) s.classList.remove("cur"); });
  const s=P.spans[P.idx];
  if(!s) return;
  s.classList.add("cur");

  highlightChar(ch);
  const plan=keyPlan(ch)||[];
  if(S.set.showHands) paintHands(document.getElementById("handsWrap"),[...new Set(plan.map(p=>p.f))]);

  const steps=plan.map(p=>{
    const lab=p.label==="⇧"?"⇧":(p.label===" "?"␣":p.label);
    return `<span class="kbig" style="background:${FINGERS[p.f].c}">${lab}</span>
            <span class="fname">${fname(p.f)}</span>`;
  }).join('<span style="color:var(--ink-3);font-size:19px">+</span>');
  document.getElementById("hintbar").innerHTML=`<span>${t("nextKey")}</span>${steps}`;

  const lh=parseFloat(getComputedStyle($text).lineHeight)||44;
  const rel=s.offsetTop-$text.offsetTop;
  $text.style.transform="translateY("+(-Math.max(0,Math.round(rel/lh)-1)*lh)+"px)";

function handleChar(ch){
  if(!P.active||P.idx>=P.text.length) return;
  if(!P.t0){ P.t0=performance.now(); P.timer=setInterval(updateLiveNow,150); }
  const exp=P.text[P.idx], s=P.spans[P.idx];
  P.typed++;
  if(ch===exp){
    P.ok++;
    s.classList.remove("cur","err"); s.classList.add("ok");
    P.idx++; sClick(ch);
    if(P.idx>=P.text.length){ finish(); return; }
    updateCursor();
  }else{
    P.err++;
    S.keyErr[exp]=(S.keyErr[exp]||0)+1;
    sErr();
    const tb=document.getElementById("typebox");
    tb.classList.remove("shake"); void tb.offsetWidth; tb.classList.add("shake");
    const wrong=CHARKEY[ch];
    if(wrong){ wrong.el.classList.add("wrongk"); setTimeout(()=>wrong.el.classList.remove("wrongk"),260); }
    if(S.set.strict){
      s.classList.add("err");
      setTimeout(()=>{ if(P.spans[P.idx]===s) s.classList.remove("err"); },420);
    }else{
      s.classList.remove("cur"); s.classList.add("err");
      P.idx++;
      if(P.idx>=P.text.length){ finish(); return; }
      updateCursor();
    }
  }
  updateLiveNow();
}

/* ------------------------------------------------------------------
   Valoració de la precisió, 0–5 ★.
   Els punts d'ancoratge són els que fan servir les certificacions:
   95 % és el mínim professional (= 4 ★) i 98 % l'excel·lència (= 5 ★).
   Per sota, cada tram val menys perquè els errors es disparen:
   95 % són 5 errades cada 100 pulsacions; 90 % ja en són 10.
------------------------------------------------------------------ */
const ACC_ANCHORS=[[0,0],[80,0],[85,1],[90,2],[95,4],[98,5],[100,5]];
function accRating(a){
  for(let i=1;i<ACC_ANCHORS.length;i++){
    if(a<=ACC_ANCHORS[i][0]){
      const [x0,y0]=ACC_ANCHORS[i-1], [x1,y1]=ACC_ANCHORS[i];
      return y0+(a-x0)/(x1-x0)*(y1-y0);
    }
  }
  return 5;
}

function finish(){
  const sec=Math.max(1.5,elapsed());
  stopPractice(); clearKb();
  const l=current, minutes=sec/60;

  /* Pulsacions brutes: només les tecles encertades, com marca la norma. */
  const gross=Math.round(P.ok/minutes);
  /* Pulsacions netes: en mode estricte totes les errades s'han corregit,
     i el temps perdut ja rebaixa les brutes, així que no es penalitza dues
     vegades. Si el mode estricte està apagat, les errades queden al text i
     s'apliquen les 5 pulsacions de penalització per errada (1 error = 1 paraula). */
  const uncorrected=S.set.strict?0:P.err;
  const net=Math.max(0,Math.round(gross-5*uncorrected/minutes));
  const acc=curAcc();
  const ppm=net;                       // el rècord oficial sempre és net

  /* Dues valoracions contínues de 0 a 5 (no arrodonides fins al final,
     perquè una millora petita ja es noti a la nota). */
  const aR=accRating(acc);                       // precisió
  const sR=Math.min(1,net/l.goal)*5;             // velocitat: arribar a la meta ja és el màxim

  /* Nota final. La precisió pesa més perquè és el que s'ha d'aprendre
     primer, i a més actua de sostre: la velocitat mai no et pot pujar
     més d'una estrella per sobre de la teva precisió. Això és el que fan
     les certificacions de veritat, on un examen per sota del 95 % no és
     vàlid per ràpid que hagis anat. */
  const raw=Math.min(0.6*aR+0.4*sR, aR+1);
  const capped=raw<0.6*aR+0.4*sR;                // la precisió ha frenat la nota
  const passed=acc>=80;                          // per sota, cal repetir la lliçó
  let stars=Math.max(1,Math.min(5,Math.round(raw)));
  if(!passed) stars=1;
  if(l.challenge&&net<l.challenge) stars=Math.min(stars,3);
  const accStars=Math.round(aR), spdStars=Math.round(sR);

  const prev=S.prog[l.id]||{stars:0,ppm:0,acc:0,done:false}, wasDone=prev.done;
  const unitWasDone=unitDone(l.u);
  const xpGain=Math.round(20+stars*12+(wasDone?0:25)+Math.min(45,Math.max(0,ppm-l.goal)*0.4));
  S.prog[l.id]={stars:Math.max(prev.stars,stars),ppm:Math.max(prev.ppm,ppm),acc:Math.max(prev.acc,acc),done:prev.done||passed};
  const unitJustDone=!unitWasDone&&unitDone(l.u);
  S.xp+=xpGain;
  S.totalSec+=Math.round(sec);
  S.hist.push({d:Date.now(),id:l.id,ppm,gross,acc,sec:Math.round(sec)});
  if(S.hist.length>250) S.hist=S.hist.slice(-250);
  const today=new Date().toISOString().slice(0,10);
  if(!S.days.includes(today)) S.days.push(today);
  save();
  sBell();                                  // el timbre de final de línia
  setTimeout(()=>sWin(stars),260);
  if(passed) confetti(stars>=4?130:80);
  showResult({l,ppm,gross,acc,sec,stars,xpGain,newAch:checkAch(),err:P.err,typed:P.typed,
              unitJustDone,passed,accStars,spdStars,aR,sR,capped});
}

/* ---------- Confeti ---------- */
const CONFETTI_COLORS=["#6d5efc","#ec4899","#fbbf24","#22c55e","#0ea5e9","#f97316","#a855f7"];
function confetti(amount,duration){
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let box=document.getElementById("confetti");
  if(!box){ box=document.createElement("div"); box.id="confetti"; document.body.appendChild(box); }
  const n=amount||90, dur=duration||2600;
  for(let i=0;i<n;i++){
    const p=document.createElement("i");
    const from=Math.random()*100;

    <div class="scoreboard">

      </div>
      <div class="scoreitem">
        <div class="si-lbl">${t("scAcc")}</div>
        <div class="si-stars">${stH(r.accStars,false)}</div>
        <div class="si-note" style="color:${r.acc>=95?"var(--ok)":r.acc<85?"var(--bad)":"var(--ink-2)"}">${r.acc}% · ${r.err} ${t("mErr").toLowerCase()}</div>
        <div class="si-sub">${r.acc>=95?t("proLevel"):fmt(t("proTarget"),{n:95})}</div>
      </div>
    </div>
    <div class="totalbox">
      <div class="t-lbl">${t("scTotal")}</div>
      <div class="bigstars">${stH(r.stars,true)}</div>
    </div>
    <div class="xpline">${fmt(t("xpGained"),{n:r.xpGain,m:msg})}</div>
    ${gateNote?`<div class="xpline" style="background:var(--bad-soft);color:var(--bad)">${gateNote}</div>`:""}
    ${hint?`<div class="xpline" style="background:color-mix(in srgb,var(--primary) 9%,var(--surface));color:var(--ink-2)">${hint}</div>`:""}
    ${r.newAch.length?`<div class="xpline" style="background:#fef3c7;color:#92400e">${fmt(t("newAch"),{a:r.newAch.map(a=>pick(a.n)).join(", ")})}</div>`:""}
    ${l.final&&r.ppm>=300&&r.acc>=95?`<div class="xpline" style="background:#dcfce7;color:#166534">${t("finalPass")}</div>`:""}
    <div class="actions">
      <button class="btn" id="rRetry">${t("retry")}</button>
      ${next&&(S.prog[l.id].done||S.set.unlockAll)?`<button class="btn primary" id="rNext">${t("nextL")}</button>`:""}
      <button class="btn ghost" id="rMenu">${t("menu")}</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  /* Si s'acaba de completar una unitat, el trofeu apareix en tancar els resultats */
  const go=action=>()=>{
    ov.remove();

  };
  ov.querySelector("#rRetry").onclick=go(()=>startPractice(l));
  const nb=ov.querySelector("#rNext"); if(nb) nb.onclick=go(()=>openLesson(next));

}

const unitDone=u=>LESSONS.filter(l=>l.u===u).every(l=>(S.prog[l.id]||{}).done);
function streak(){
  if(!S.days.length) return 0;
  const set=new Set(S.days); let n=0; const d=new Date();
  for(;;){
    const iso=d.toISOString().slice(0,10);
    if(set.has(iso)){ n++; d.setDate(d.getDate()-1); }
    else if(n===0){
      d.setDate(d.getDate()-1);
      if(set.has(d.toISOString().slice(0,10))){ n++; d.setDate(d.getDate()-1); } else break;
    } else break;
    if(n>400) break;
  }
  return n;
}

let G={on:false,words:[],score:0,lives:3,level:1,raf:null,spawn:null,last:0,killed:0,spawnOne:null};
const gArea=document.getElementById("gameArea"), gInput=document.getElementById("gInput");

function seedStars(){
  gArea.innerHTML="";
  for(let i=0;i<60;i++){
    const s=document.createElement("div"); s.className="star";
    s.style.left=Math.random()*100+"%"; s.style.top=Math.random()*100+"%";
    s.style.opacity=(0.2+Math.random()*0.6);
    s.style.width=s.style.height=(Math.random()<.2?3:2)+"px";
    gArea.appendChild(s);
  }
}
seedStars();
function gamePool(){
  const set=allowed(nextLesson().u>=3?9:2);
  const p=C().WORDS.filter(w=>w.length>=3&&w.length<=9&&fits(w,set));
  return p.length>20?p:C().WORDS.filter(w=>w.length<=7);
}
function stopGame(){ G.on=false; cancelAnimationFrame(G.raf); clearInterval(G.spawn); }
function rearmSpawn(){
  clearInterval(G.spawn);
  G.spawn=setInterval(()=>G.spawnOne&&G.spawnOne(), Math.max(650,2200-G.level*130));
}
function startGame(){
  stopGame(); seedStars();
  G={on:true,words:[],score:0,lives:3,level:1,raf:null,spawn:null,last:performance.now(),killed:0,spawnOne:null};
  updateGameHud(); gInput.value=""; gInput.focus();
  const pool=gamePool();
  G.spawnOne=()=>{
    if(!G.on||G.words.length>=7) return;
    const el=document.createElement("div"); el.className="fword";
    const w=rnd(pool);
    el.textContent=w;
    el.style.left=(4+Math.random()*62)+"%"; el.style.top="-40px";
    gArea.appendChild(el);
    G.words.push({el,w,y:-40,v:30+G.level*7+Math.random()*10});
  };
  G.spawnOne(); rearmSpawn();
  const loop=tm=>{
    if(!G.on) return;
    const dt=Math.min(0.05,(tm-G.last)/1000); G.last=tm;
    const H=gArea.clientHeight;
    for(let i=G.words.length-1;i>=0;i--){
      const o=G.words[i];
      o.y+=o.v*dt; o.el.style.top=o.y+"px";
      if(o.y>H-34){
        o.el.remove(); G.words.splice(i,1);
        G.lives--; sErr(); updateGameHud();
        if(G.lives<=0){ endGame(); return; }
      }
    }
    G.raf=requestAnimationFrame(loop);
  };
  G.raf=requestAnimationFrame(loop);
}
function updateGameHud(){
  document.getElementById("gScore").textContent=G.score;
  document.getElementById("gLives").textContent="❤️".repeat(Math.max(0,G.lives))||"💀";
  document.getElementById("gLevel").textContent=G.level;
  document.getElementById("gBest").textContent=S.gameBest;
}
gInput.addEventListener("input",()=>{
  if(!G.on) return;
  const v=gInput.value.trim().toLowerCase();
  G.words.forEach(o=>{
    if(v&&o.w.startsWith(v)) o.el.innerHTML='<span class="hit">'+o.w.slice(0,v.length)+"</span>"+o.w.slice(v.length);
    else o.el.textContent=o.w;
  });
});
gInput.addEventListener("keydown",e=>{
  if(!G.on) return;
  if(e.key===" "||e.key==="Enter"){
    e.preventDefault();
    const v=gInput.value.trim().toLowerCase();
    const i=G.words.findIndex(o=>o.w===v);
    if(i>=0){
      const o=G.words[i];
      o.el.classList.add("boom"); setTimeout(()=>o.el.remove(),300);
      G.words.splice(i,1);
      G.score+=v.length; G.killed++;
      beep(880,0.08,"triangle",0.05);
      if(G.killed%8===0){ G.level++; rearmSpawn(); beep(1200,0.2,"triangle",0.06); }
      updateGameHud();
    }else sErr();
    gInput.value="";
  }
});
function endGame(){
  stopGame();
  if(G.score>S.gameBest) S.gameBest=G.score;
  S.xp+=Math.round(G.score*0.8); save();
  const gained=checkAch();
  updateGameHud();
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal"><h3>${t("gameOver")}</h3>
    <div class="sub">${fmt(t("gameCaught"),{n:G.killed})}</div>
    <div class="resgrid" style="grid-template-columns:repeat(3,1fr)">
      <div><b>${G.score}</b><span>${t("gScore")}</span></div>
      <div><b>${G.level}</b><span>${t("gLevel")}</span></div>
      <div><b>${S.gameBest}</b><span>${t("gBest")}</span></div>
    </div>
    ${gained.length?`<div class="xpline" style="background:#fef3c7;color:#92400e">🏆 ${gained.map(a=>pick(a.n)).join(", ")}</div>`:""}
    <div class="actions"><button class="btn primary" id="gAgain">${t("again")}</button>
    <button class="btn ghost" id="gClose">${t("quit")}</button></div></div>`;
  document.body.appendChild(ov);
  ov.querySelector("#gAgain").onclick=()=>{ov.remove();startGame();};
  ov.querySelector("#gClose").onclick=()=>ov.remove();
}
document.getElementById("gStart").onclick=startGame;

/* Retalla una imatge/vídeo a un quadrat petit i el converteix en data URL */
function toSquareDataURL(src,size,mirror){
  const c=document.createElement("canvas"); c.width=c.height=size||200;
  const ctx=c.getContext("2d");
  const sw=src.videoWidth||src.naturalWidth||src.width;
  const sh=src.videoHeight||src.naturalHeight||src.height;
  const s=Math.min(sw,sh);
  if(mirror){ ctx.translate(c.width,0); ctx.scale(-1,1); }
  ctx.drawImage(src,(sw-s)/2,(sh-s)/2,s,s,0,0,c.width,c.height);
  return c.toDataURL("image/jpeg",0.82);
}

/* ---------- Càmera ---------- */
function openCamera(onPhoto){
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal" style="max-width:400px">
    <h3>${t("takePhoto")}</h3>
    <div class="sub" id="camMsg">${t("cameraStarting")}</div>
    <div class="camwrap" id="camWrap"><video id="camVid" autoplay playsinline muted></video></div>
    <div class="actions" style="margin-top:16px">
      <button class="btn primary" id="camShot">${t("capture")}</button>
      <button class="btn ghost" id="camCancel">${t("cancelB")}</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const vid=ov.querySelector("#camVid"), msg=ov.querySelector("#camMsg");
  const wrap=ov.querySelector("#camWrap"), shot=ov.querySelector("#camShot");
  let stream=null, shotData=null;
  const close=()=>{ if(stream) stream.getTracks().forEach(tr=>tr.stop()); ov.remove(); };
  ov.querySelector("#camCancel").onclick=close;

  navigator.mediaDevices&&navigator.mediaDevices.getUserMedia
    ? navigator.mediaDevices.getUserMedia({video:{facingMode:"user",width:{ideal:640},height:{ideal:640}},audio:false})
        .then(st=>{ stream=st; vid.srcObject=st; msg.textContent=""; })
        .catch(()=>fail())
    : fail();

  function fail(){
    wrap.style.display="none"; shot.style.display="none";
    msg.innerHTML='<div class="camnote">'+t("cameraError")+"</div>";
  }
  shot.onclick=()=>{
    if(!shotData){
      shotData=toSquareDataURL(vid,220,true);
      wrap.innerHTML='<img src="'+shotData+'" alt="">';
      if(stream){ stream.getTracks().forEach(tr=>tr.stop()); stream=null; }
      shot.textContent=t("usePhoto");
      const rt=document.createElement("button");
      rt.className="btn"; rt.textContent=t("retake");
      rt.onclick=()=>{ ov.remove(); openCamera(onPhoto); };
      shot.parentElement.insertBefore(rt,shot);
    }else{ onPhoto(shotData); close(); }
  };
}

/* ---------- Pujar una imatge del disc o de la càmera del mòbil ---------- */
function pickImage(onPhoto){
  const i=document.createElement("input");
  i.type="file"; i.accept="image/*"; i.setAttribute("capture","user");
  i.onchange=()=>{
    const f=i.files&&i.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      const img=new Image();
      img.onload=()=>onPhoto(toSquareDataURL(img,220,false));
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  i.click();
}

/* ---------- Formulari de perfil (crear / editar) ---------- */
function profileForm(p,isEdit,onDone){
  p=p||{name:"",age:"",avatar:"🦄"};
  let avatar=p.avatar;
  const first=!DB.profiles.length&&!isEdit;
  const ov=document.createElement("div"); ov.className="overlay";
  ov.innerHTML=`<div class="modal" style="max-width:480px;text-align:left">
    <h3 style="text-align:center">${first?t("welcomeTitle"):(isEdit?t("editProfile"):t("newProfile"))}</h3>
    <div class="sub" style="text-align:center">${first?t("welcomeSub"):""}</div>
    ${first?`<div class="langsel big" id="pfLang">${langButtons(true)}</div>`:""}
    <div class="av avpreview" id="pfAv"></div>
    <div class="field"><label>${t("nameLabel")}</label>
      <input id="pfName" maxlength="18" placeholder="${t("namePh")}" value="${(p.name||"").replace(/"/g,"&quot;")}"></div>
    <div class="field"><label>${t("ageLabel")}</label>
      <input id="pfAge" type="number" min="4" max="99" placeholder="${t("agePh")}" value="${p.age||""}"></div>
    <div class="field"><label>${t("chooseAvatar")}</label>
      <div class="avgrid" id="pfGrid"></div>
      <div class="photorow">
        <button class="btn" id="pfCam">${t("takePhoto")}</button>
        <button class="btn" id="pfUp">${t("uploadPhoto")}</button>
      </div>
    </div>
    <div class="actions">
      <button class="btn primary" id="pfSave">${isEdit?t("saveB"):t("createProfile")}</button>
      ${first?"":`<button class="btn ghost" id="pfCancel">${t("cancelB")}</button>`}
    </div>
  </div>`;
  document.body.appendChild(ov);

  /* canvi d'idioma des de la mateixa pantalla de benvinguda */
  const ls=ov.querySelector("#pfLang");
  if(ls){
    ls.querySelectorAll("button").forEach(b=>{
      b.classList.toggle("on",b.dataset.l===((S&&S.lang)||UILANG));
      b.onclick=()=>{
        const draft={name:ov.querySelector("#pfName").value,age:ov.querySelector("#pfAge").value,avatar};
        ov.remove();
        setLang(b.dataset.l);
        profileForm(draft,isEdit,onDone);
      };
    });
  }
  const prev=ov.querySelector("#pfAv"), grid=ov.querySelector("#pfGrid");
  const paint=()=>{
    setAvatar(prev,avatar);
    grid.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.a===avatar));
  };
  grid.innerHTML=AVATARS.map(a=>`<button data-a="${a}">${a}</button>`).join("");
  grid.querySelectorAll("button").forEach(b=>b.onclick=()=>{ avatar=b.dataset.a; paint(); });
  paint();
  ov.querySelector("#pfCam").onclick=()=>openCamera(d=>{ avatar=d; paint(); });
  ov.querySelector("#pfUp").onclick=()=>pickImage(d=>{ avatar=d; paint(); });
  const cancel=ov.querySelector("#pfCancel"); if(cancel) cancel.onclick=()=>ov.remove();
  ov.querySelector("#pfSave").onclick=()=>{
    const name=ov.querySelector("#pfName").value.trim();
    if(!name){ alert(t("nameRequired")); return; }
    let age=parseInt(ov.querySelector("#pfAge").value,10);
    if(!(age>=4&&age<=99)) age=null;
    ov.remove();
    onDone({name,age,avatar});
  };
  setTimeout(()=>ov.querySelector("#pfName").focus(),60);
}

function createProfileFlow(){
  profileForm(null,false,d=>{
    const p=newProfile(d.name,d.age,d.avatar);
    DB.profiles.push(p);
    S=p; DB.active=p.id;
    if(!save()){ /* si la foto no cabia, es desa amb emoji */ p.avatar="🦄"; save(); }
    document.querySelector("header.top").style.visibility="";
    applySettings(); applyI18n();
    renderHome(); renderCourse(); renderAch(); renderStats(); renderSettings(); renderProfiles();
    show("home");
  });
}
function editProfileFlow(prof){
  profileForm(prof,true,d=>{
    const before=prof.avatar;
    prof.name=d.name; prof.age=d.age; prof.avatar=d.avatar;
    if(!save()){ prof.avatar=before; save(); }
    renderHome(); renderProfiles(); renderSettings(); renderAch();
  });
}
function deleteProfileFlow(prof){
  if(!confirm(fmt(t("confirmDeleteProfile"),{n:prof.name}))) return;
  DB.profiles=DB.profiles.filter(x=>x.id!==prof.id);
  if(S&&S.id===prof.id) S=DB.profiles[0]||null;
  DB.active=S?S.id:null;
  save();
  if(!S){ boot(); return; }
  applySettings(); applyI18n();
  renderHome(); renderCourse(); renderAch(); renderStats(); renderSettings(); renderProfiles();
  show("profiles");
}

function renderProfiles(){
  const g=document.getElementById("profGrid");
  if(!g) return;
  g.innerHTML=DB.profiles.map(p=>{
    const done=Object.values(p.prog||{}).filter(x=>x.done).length;
    let best=0;
    for(const id in (p.prog||{})) if(countsForRecord(LESSONS[Number(id)-1])) best=Math.max(best,p.prog[id].ppm||0);
    return `<button class="profcard ${S&&p.id===S.id?"active":""}" data-id="${p.id}">
      <span class="edit" data-edit="${p.id}">✏️</span>
      <div class="av">${avatarHTML(p.avatar)}</div>
      <div class="pn">${p.name}</div>
      <div class="pa">${p.age?fmt(t("ageYears"),{n:p.age}):"&nbsp;"}</div>
      <div class="pstats">
        <div><b>${done}</b>${t("cardLessons")}</div>
        <div><b>${best}</b>${t("cardBest")}</div>
      </div>
    </button>`;
  }).join("")+
  `<button class="profcard add" id="profAdd"><div class="plus">＋</div><div>${t("addProfile")}</div></button>`;

  g.querySelectorAll(".profcard[data-id]").forEach(b=>{
    b.onclick=e=>{
      const ed=e.target.closest("[data-edit]");
      const p=DB.profiles.find(x=>x.id===b.dataset.id);
      if(ed){ editProfileFlow(p); return; }
      switchTo(b.dataset.id);
    };
  });
  document.getElementById("profAdd").onclick=createProfileFlow;
}
document.getElementById("userchip").onclick=()=>{
  stopPractice(); stopGame(); show("profiles"); renderProfiles();
};

/* ============================================================
   17. AJUSTOS
   ============================================================ */
function renderSettings(){
  if(!S) return;
  document.getElementById("setSize").value=S.set.size||"";
  document.getElementById("setLangSel").value=S.lang;
  document.getElementById("setExLen").value=S.set.exLen||"auto";
  const ch=targetChars(null), secs=Math.round(ch/recentSpeed()*60);
  document.getElementById("setExLenD").textContent=fmt(t("setExLenD"),{
    n:Math.max(1,Math.round(ch/40)),      // ~40 caràcters per línia a la mida normal
    m:Math.floor(secs/60)+":"+String(secs%60).padStart(2,"0")});
  setAvatar(document.getElementById("setAv"),S.avatar);
  document.getElementById("setProfName").textContent=S.name;
  document.getElementById("setProfAge").textContent=S.age?fmt(t("ageYears"),{n:S.age}):"—";
  document.getElementById("btnEditProfile").textContent=t("editProfile");
  document.getElementById("btnSwitchProfile").textContent=t("switchUser");
  document.querySelectorAll(".toggle[data-set]").forEach(tg=>{
    tg.classList.toggle("on",!!S.set[tg.dataset.set]);
    tg.onclick=()=>{
      S.set[tg.dataset.set]=!S.set[tg.dataset.set]; save(); applySettings(); renderSettings();
      if(tg.dataset.set==="unlockAll"){ renderCourse(); renderHome(); }
    };
  });
}
document.getElementById("setSize").addEventListener("change",e=>{S.set.size=e.target.value;save();});
document.getElementById("setExLen").addEventListener("change",e=>{S.set.exLen=e.target.value;save();renderSettings();});
document.getElementById("setLangSel").addEventListener("change",e=>setLang(e.target.value));
document.getElementById("btnEditProfile").onclick=()=>editProfileFlow(S);
document.getElementById("btnSwitchProfile").onclick=()=>{show("profiles");renderProfiles();};
document.getElementById("btnDelProfile").onclick=()=>deleteProfileFlow(S);
function applySettings(){ document.documentElement.dataset.theme=(S&&S.set.dark)?"dark":"light"; }

document.getElementById("btnReset").onclick=()=>{
  if(confirm(fmt(t("confirmReset"),{n:S.name}))){
    const keep={id:S.id,name:S.name,age:S.age,avatar:S.avatar,lang:S.lang,created:S.created};
    const fresh=Object.assign(JSON.parse(JSON.stringify(DEF)),keep);
    DB.profiles[DB.profiles.indexOf(S)]=fresh; S=fresh; save();
    applySettings(); applyI18n(); renderHome(); renderSettings(); renderCourse(); show("home");
  }
};
/* Exporta TOTS els perfils, per poder canviar d'ordinador sense perdre res */
document.getElementById("btnExport").onclick=()=>{
  const b=new Blob([JSON.stringify(DB)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="mecabruna-progres.json"; a.click();
};
document.getElementById("btnImport").onclick=()=>{
  const i=document.createElement("input"); i.type="file"; i.accept="application/json";
  i.onchange=()=>{
    const f=i.files[0]; if(!f) return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const d=JSON.parse(rd.result);
        let profiles=null;
        if(d&&Array.isArray(d.profiles)) profiles=d.profiles;          // còpia nova
        else if(d&&d.prog) profiles=[Object.assign({id:uid(),created:Date.now(),name:d.name||"?"},d)]; // còpia antiga
        if(!profiles||!profiles.length){ alert(t("invalidFile")); return; }
        profiles.forEach(p=>{
          if(!p.id) p.id=uid();
          p.set=Object.assign({},DEF.set,p.set||{});
          if(!p.lang) p.lang=defaultLang();
          const ix=DB.profiles.findIndex(x=>x.id===p.id);
          if(ix>=0) DB.profiles[ix]=p; else DB.profiles.push(p);
        });
        S=DB.profiles.find(x=>x.id===(d.active||profiles[0].id))||DB.profiles[0];
        DB.active=S.id; save();
        applySettings(); applyI18n();
        renderHome(); renderSettings(); renderCourse(); renderProfiles();
        alert(t("imported"));
      }catch(e){ alert(t("invalidFile")); }
    };
    rd.readAsText(f);
  };
  i.click();
};

/* ============================================================
   18. ARRENCADA
   ============================================================ */
function boot(){
  UILANG=(S&&S.lang)||defaultLang();
  buildKeyboard();
  applySettings();
  applyI18n();
  document.getElementById("handsWrap").innerHTML=handsSVG();
  if(!S){
    // encara no hi ha cap perfil: primer, crear-ne un
    document.querySelector("header.top").style.visibility="hidden";
    show("home");
    createProfileFlow();
    return;
  }
  document.querySelector("header.top").style.visibility="";
  renderHome();
  renderProfiles();
  show(DB.profiles.length>1?"profiles":"home");
}
boot();

document.addEventListener("keydown",e=>{
  if(!document.getElementById("view-intro").classList.contains("hidden")&&e.key==="Enter"){
    e.preventDefault(); startPractice(current);
  }
});
